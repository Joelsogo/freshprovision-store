services:
  - type: web
    name: freshprovision
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freshprovision-db
          property: connectionString

databases:
  - name: freshprovision-db
    plan: free
    databaseName: freshprovision
    user: freshprovision
