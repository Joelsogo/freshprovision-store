services:
  - type: web
    name: freshprovision
    runtime: php
    plan: free
    buildCommand: ""
    startCommand: "php -S 0.0.0.0:$PORT"
    envVars:
      - key: PHP_VERSION
        value: "8.3"
      - key: DATABASE_URL
        fromDatabase:
          name: freshprovision-db
          property: connectionString

databases:
  - name: freshprovision-db
    plan: free
    databaseName: freshprovision
    user: freshprovision
