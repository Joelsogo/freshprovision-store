services:
  - type: web
    name: freshprovision
    runtime: php
    plan: free
    buildCommand: ""
    startCommand: "php -S 0.0.0.0:$PORT"
    envVars:
      - key: PHP_VERSION
        value: "8.3"
    # Note: Free plan has ephemeral disk.
    # SQLite data in /data will be reset on restart/redeploy.
    # For permanent data later, switch to PostgreSQL.
